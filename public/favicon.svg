<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgSmall" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14163A"/>
      <stop offset="100%" stop-color="#2A1750"/>
    </linearGradient>
    <linearGradient id="ringSmall" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B7FFF"/>
      <stop offset="100%" stop-color="#3FE0D0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bgSmall)"/>

  <!-- single bold ring, thick stroke for legibility at tiny sizes -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="url(#ringSmall)" stroke-width="9"
    stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="22"
    transform="rotate(-90 32 32)"/>

  <!-- core -->
  <circle cx="32" cy="32" r="7.5" fill="#F5F6FE"/>
</svg>
